<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">

<title>Шығыстануға кіріспе — викторина</title>
<style>
:root{--bg:#46178f;--card:#fff;--ink:#1c1c28;--soft:#e3d6fa;--r:#e21b3c;--b:#1368ce;--y:#d89e00;--g:#26890c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2d0f5e;--card:#f4f0fb}}
:root[data-theme="dark"]{--bg:#2d0f5e;--card:#f4f0fb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 32px;text-align:center}
h1{font-size:clamp(26px,6vw,40px);margin:8px 0}
.sub{color:var(--soft);margin:6px 0 14px}
.chips{display:grid;gap:8px;text-align:left;margin:14px 0}
.chip{background:rgba(255,255,255,.12);color:#fff;border:2px solid transparent;border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.chip b{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:rgba(255,255,255,.25);margin-right:8px}
.chip.on{background:#fff;color:var(--ink)}.chip.on b{background:var(--bg);color:#fff}
.go{background:#fff;color:var(--bg);border:0;border-radius:12px;padding:14px 32px;font:700 18px inherit;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);margin:6px}
.go:disabled{opacity:.5;cursor:not-allowed}.go.alt{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#fff}
.qt{background:var(--card);color:var(--ink);border-radius:14px;padding:22px 16px;margin:16px 0;font-size:clamp(18px,3.6vw,26px)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.ans{grid-template-columns:1fr}}
.a{color:#fff;border:0;border-radius:10px;padding:18px 12px;min-height:76px;font:600 17px inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:opacity .2s,transform .1s}
.a:active:not(:disabled){transform:translateY(2px)}
.a span{font-size:26px;flex:none}
.a.r{background:var(--r)}.a.b{background:var(--b)}.a.y{background:var(--y)}.a.g{background:var(--g)}
.a.dim{opacity:.3}.a.bad{opacity:.55}.a.ok{outline:4px solid #fff}
.fb{margin-top:16px;padding:14px;border-radius:12px;background:rgba(0,0,0,.25);animation:in .3s}
.fb b{display:block;font-size:22px}.fb.good b{color:#9df08a}.fb.no b{color:#ffb3bd}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.big{font-size:72px;font-weight:800}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0}
.stats div{flex:1;max-width:150px;background:rgba(255,255,255,.12);border-radius:12px;padding:12px}
.stats b{display:block;font-size:26px}
.wl{text-align:left;display:grid;gap:8px;margin:10px 0 18px}
.w{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}input{color:#1c1c28}.w p{margin:2px 0}.w small{color:var(--soft)}.w span{color:#9df08a;font-weight:600}
</style></head>

<script>

[1,"Аурангзебтің сарай дәрігері болып, Ұлы Моғол мемлекеті туралы еңбек жазған кім?",["Ф. Бернье","Марко Поло","Плано Карпини","Виллем Рубрук"]],

[2,"Шоқан Уәлихановтың атасы кім болды?",["Абылай хан","Кенесары хан","Тәуке хан","Әбілқайыр хан"]],
[2,"12 жасында Шоқан қай оқу орнына түсті?",["Сібір кадет корпусы","Қазан университеті","Петербург университеті","Орынбор кадет корпусы"]],

[2,"Шоқан қай эпостың бөлімдерін хатқа түсіріп, орыс тіліне аударды?",["«Манас»","«Алпамыс батыр»","«Көрұғлы»","«Қобыланды батыр»"]],

[3,"Орта Азия халықтарының қатынас құралы болған тіл қайсы?",["Соғды тілі","Парфян тілі","Пехлеви","Осетин тілі"]],
[3,"Орта парсы тілінің басқаша атауы қандай?",["Пехлеви","Дари","Пушту","Авеста"]],
[3,"Афразиялық тілдердің чад бұтағындағы ең көп тараған тілдердің бірі қайсы?",["Хауса","Сомали","Оромо","Копт"]],
[3,"Афразиялық тілдерде сөйлейтіндердің саны қанша?",["270–300 млн","50–70 млн","100–120 млн","500–600 млн"]],
[4,"Ежелгі Мысыр әдебиетінің ең көне ескерткіші болып не есептеледі?",["«Пирамида мәтіндері»","«Унидің өмір суреттемесі»","Мемфис діни трактаты","«Хуфхордың өмір суреттемесі»"]],
[4,"Мысыр мифіндегі шөл құдайы Сет кімнің бауыры?",["Осирис","Ра","Гор","Анубис"]],
[4,"Ежелгі мысыр әдебиеті шартты түрде неше кезеңге бөлінеді?",["3","2","4","5"]],
[4,"Ежелгі Шығыс әдебиетінде бастапқыда не пайда болды?",["Ауыз әдебиеті","Жазба әдебиет","Драматургия","Поэтика теориясы"]],
[4,"Алғашқы диалог пен монолог түріндегі жазбалар кезеңі қалай аталды?",["«Шешендік өнер кезеңі»","«Классикалық кезең»","«Пирамида кезеңі»","«Нақыл сөздер кезеңі»"]],
[5,"Буддалық канон «Типитака» сөзбе-сөз нені білдіреді?",["«Үш себет»","«Бес кітап»","«Бұлт хабаршысы»","«Саз арбасы»"]],
[5,"«Панчатантра» атауы нені білдіреді?",["«Бес кітап»","«Үш себет»","«Будда өмірі»","«Ракша сақинасы»"]],
[5,"«Будда өмірі» (Буддхачарита) поэмасының авторы кім?",["Ашвагхоша","Калидаса","Шудрака","Бхартрихари"]],
[5,"«Саз арбасы» драмасының авторы кім?",["Шудрака","Калидаса","Вишакхадата","Ашвагхоша"]],
[5,"Үнді драматургиясы мен театр өнерінің теориясы қай трактатта көрініс тапты?",["«Натьяшастра»","«Панчатантра»","«Типитака»","«Рагхувамша»"]],
[6,"Хронологиялық ең ерте сабалық (оңтүстік арабтық) әліпбиде неше белгі болды?",["29","22","28","32"]],
[6,"Араб жазуы қай әліпбиден бөлініп шықты?",["Набатей мемлекетіндегі 22 таңбалы арамей әліпбиінен","Сабалық 29 таңбалы әліпбиден","Грек әліпбиінен","Египет иероглифтерінен"]],
[6,"Құранның жазбаша мәтінін құрастыру кімге тапсырылды?",["Зейд бен Сәбитке","Әбу Бәкірге","Ибн Шихаб аз-Зухриге","Ибн Джурайджге"]],
[6,"Хадис жазуын бекіткен тарихтағы ең басты тұлға кім?",["Ибн Шихаб аз-Зухри","Зейд бен Сәбит","Иахйа б. Са’ид ал-Ансари","Ибн Джурайдж"]],
[6,"Заң мен ережелерді оқу туралы араб жазуының жаңа саласы қалай аталады?",["Фикх","Хадис","Сүнна","Тафсир"]],
[7,"622 жылы Мұхаммед пайғамбар қай қалаға қоныс аударды?",["Мединеге","Меккеге","Тайфқа","Иерусалимге"]],
[7,"Мұхаммед қоныс аударған соң Ясриб қаласы қалай аталды?",["Медине","Мекке","Куфа","Басра"]],
[7,"Мұхаммед Меккеге салтанатпен қай жылы қадам басты?",["630","622","632","610"]],
[7,"Зекеттің бастапқы мөлшері мүліктің жалпы құнының қанша пайызы болды?",["2,5 пайыз","10 пайыз","5 пайыз","1 пайыз"]],
[7,"VI ғасырда Оңтүстік Аравияда ханифтер кімдер болды?",["Бір Құдайға сеніп, пұтқа табынудан бас тартуға шақырған уағыздаушылар","Құрейш тайпасының бай көпестері","Мединедегі мұсылман қауымы","Хадис жинаушылар"]]
];
const T=["Шығыстану ғылымы туралы жалпы түсінік","Қазақстандық шығыстанудың дамуы","Азия және Солтүстік Африка халықтарының тілдері","Азия және Солтүстік Африка халықтарының әдебиеті","Оңтүстік және Шығыс Азия халықтарының әдебиеті","Шығыс дерекнамасы","Солтүстік Африка мен Азиядағы әлемдік діндер"];
const $=s=>document.querySelector(s),app=$("#app"),LIM=20,SH=["▲","◆","●","■"],CL=["r","b","y","g"];
let sel=new Set([1,2,3,4,5,6,7]),G=null,tm=null;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(){try{return+localStorage.getItem("shyg_best")||0}catch(e){return 0}},set(v){try{localStorage.setItem("shyg_best",String(v))}catch(e){}}};

function home(){
  clearInterval(tm);
  const n=Q.filter(q=>sel.has(q[0])).length;
  app.innerHTML=`<div class="wrap"><h1>Шығыстануға кіріспе</h1><p class="sub">Кахут үлгісіндегі викторина · 1–7 тақырыптар</p>
  <div class="chips">${T.map((t,i)=>`<button class="chip ${sel.has(i+1)?"on":""}" data-t="${i+1}"><b>${i+1}</b>${t}</button>`).join("")}</div>
  <p class="sub">Таңдалған сұрақтар: ${n} · Үздік нәтиже: ${store.get()}</p>
  <button class="go" id="go" ${n?"":"disabled"}>Бастау</button></div>`;
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const t=+c.dataset.t;sel.has(t)?sel.delete(t):sel.add(t);home()});
  $("#go").onclick=start;
}
function start(){
  const list=sh(Q.filter(q=>sel.has(q[0]))).map(q=>{const o=sh(q[2].map((x,i)=>({x,c:i===0})));return{t:q[0],q:q[1],o:o.map(z=>z.x),a:o.findIndex(z=>z.c)}});
  G={list,i:0,score:0,streak:0,right:0,wrong:[],done:false,t0:0};
  show();
}
function show(){
  const q=G.list[G.i];
  app.innerHTML=`<div class="wrap"><div class="top"><span>${G.i+1} / ${G.list.length}</span><span>${G.streak>1?"Серия ×"+G.streak+" · ":""}${G.score} ұпай</span></div>
  <div class="bar"><i id="bar"></i></div><h2 class="qt">${q.q}</h2>
  <div class="ans">${q.o.map((o,k)=>`<button class="a ${CL[k]}" data-k="${k}"><span>${SH[k]}</span>${o}</button>`).join("")}</div><div id="fb"></div></div>`;
  document.querySelectorAll(".a").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  G.done=false;G.t0=Date.now();
  clearInterval(tm);
  tm=setInterval(()=>{const e=(Date.now()-G.t0)/1000;$("#bar").style.width=Math.max(0,100-e/LIM*100)+"%";if(e>=LIM)answer(-1)},100);
}
function answer(k){
  if(G.done)return;G.done=true;clearInterval(tm);
  const q=G.list[G.i],e=Math.min(LIM,(Date.now()-G.t0)/1000),ok=k===q.a,p=ok?Math.round(1000*(1-e/LIM/2)):0;
  G.score+=p;G.streak=ok?G.streak+1:0;if(ok)G.right++;else G.wrong.push(q);
  document.querySelectorAll(".a").forEach((b,i)=>{b.disabled=true;b.classList.add(i===q.a?"ok":i===k?"bad":"dim")});
  const last=G.i+1>=G.list.length;
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"no"}"><b>${ok?"Дұрыс! +"+p:k<0?"Уақыт бітті":"Қате"}</b><button class="go" id="nx">${last?"Нәтиже":"Келесі"}</button></div>`;
  $("#nx").onclick=()=>{G.i++;last?end():show()};
}
function end(){
  const best=store.get(),nb=G.score>best;if(nb)store.set(G.score);
  const n=G.list.length,pc=Math.round(G.right/n*100);
  app.innerHTML=`<div class="wrap"><h1>Нәтиже</h1><div class="big">${G.score}</div><p class="sub">ұпай · ${nb?"жаңа рекорд!":"үздік: "+best}</p>
  <div class="stats"><div><b>${G.right}/${n}</b>дұрыс</div><div><b>${pc}%</b>дәлдік</div><div><b>${n-G.right}</b>қате</div></div>
  ${G.wrong.length?`<h3>Қателер талдауы</h3><div class="wl">${G.wrong.map(q=>`<div class="w"><small>${q.t}-тақырып</small><p>${q.q}</p><span>${q.o[q.a]}</span></div>`).join("")}</div>`:""}
  <button class="go" id="again">Қайта ойнау</button><button class="go alt" id="hm">Басты бет</button></div>`;
  $("#again").onclick=start;$("#hm").onclick=home;
}

 clearInterval(tm); clearInterval(hostTimer);
 const n=Q.filter(q=>sel.has(q[0])).length;

}
function hostSetup(){
 app.innerHTML=`<div class="wrap"><h1>Бөлме иесі</h1><p class="sub">Өз атыңды енгізіп, бөлме құр.</p><input id="ownerName" maxlength="20" placeholder="Иесінің аты" style="width:100%;padding:14px;border-radius:10px;border:0;font:inherit;margin:10px 0"><button class="go" id="create">Бөлме құру</button><button class="go alt" id="back">Артқа</button><div id="msg"></div></div>`;
 $('#back').onclick=collabHome;
 $('#create').onclick=async()=>{
  myName=$('#ownerName').value.trim(); if(!myName) return $('#msg').textContent='Атыңды енгіз.';
  try{
   await initSupabase(); roomCode=code6(); myRole='host';
   const a=await sb.from('rooms').insert({code:roomCode,owner:myName,status:'lobby',list:mkList(),idx:0,started_at:0}); if(a.error)throw a.error;
   const b=await sb.from('players').insert({room:roomCode,name:myName}); if(b.error)throw b.error;
   watchRoom();
  }catch(e){$('#msg').textContent='Қате: '+errMsg(e);}
 };
}
function joinSetup(){
 app.innerHTML=`<div class="wrap"><h1>Бөлмеге қосылу</h1><input id="playerName" maxlength="20" placeholder="Ойыншының аты" style="width:100%;padding:14px;border-radius:10px;border:0;font:inherit;margin:8px 0"><input id="roomCode" maxlength="6" placeholder="6 таңбалы бөлме коды" style="width:100%;padding:14px;border-radius:10px;border:0;font:inherit;margin:8px 0;text-transform:uppercase"><button class="go" id="enter">Қосылу</button><button class="go alt" id="back">Артқа</button><div id="msg"></div></div>`;
 $('#back').onclick=collabHome;
 $('#enter').onclick=async()=>{
  myName=$('#playerName').value.trim(); roomCode=$('#roomCode').value.trim().toUpperCase();
  if(!myName||roomCode.length!==6) return $('#msg').textContent='Атың мен бөлме кодын енгіз.';
  try{
   await initSupabase();
   const r=await sb.from('rooms').select('status').eq('code',roomCode).maybeSingle(); if(r.error)throw r.error;
   if(!r.data) return $('#msg').textContent='Мұндай бөлме табылмады.';
   if(r.data.status==='finished'||r.data.status==='closed') return $('#msg').textContent='Бұл ойын аяқталған.';
   myRole='player';
   const p=await sb.from('players').insert({room:roomCode,name:myName}); if(p.error&&p.error.code!=='23505')throw p.error;
   watchRoom();
  }catch(e){$('#msg').textContent='Қосылу қатесі: '+errMsg(e);}
 };
}
async function loadRoom(){
 const r=await sb.from('rooms').select('*').eq('code',roomCode).maybeSingle(); if(r.error)throw r.error; if(!r.data)return null;
 const [p,a]=await Promise.all([sb.from('players').select('*').eq('room',roomCode),sb.from('answers').select('*').eq('room',roomCode).eq('idx',r.data.idx)]);
 return {...r.data,players:p.data||[],answers:a.data||[]};
}
function watchRoom(){
 stopWatch(); lastSig="";
 const f=col=>({event:'*',schema:'public',table:col,filter:(col==='rooms'?'code':'room')+'=eq.'+roomCode});
 channel=sb.channel('room-'+roomCode)
  .on('postgres_changes',f('rooms'),refresh).on('postgres_changes',f('players'),refresh).on('postgres_changes',f('answers'),refresh).subscribe();
 pollTimer=setInterval(refresh,2500); // запасной вариант, если Realtime не включён
 refresh();
}
function stopWatch(){clearInterval(pollTimer);pollTimer=null;if(channel&&sb){sb.removeChannel(channel);}channel=null;}
async function refresh(){
 if(!roomCode)return; if(busy){pending=true;return;} busy=true;
 try{do{
  pending=false;
  const s=await loadRoom();
  if(!s){stopWatch();app.innerHTML=`<div class="wrap"><h1>Бөлме табылмады</h1><button class="go" id="home">Басты бет</button></div>`;$('#home').onclick=()=>{cleanupRoom();collabHome();};return;}
  roomState=s;
  if(myRole==='host') await scoreAnswers();
  const sig=JSON.stringify([s.status,s.idx,s.players.map(p=>[p.uid,p.name,p.score]),s.answers.map(a=>[a.uid,a.scored])]);
  if(sig!==lastSig){lastSig=sig;myRole==='host'?renderHost():renderPlayer();}
 }while(pending);}
 catch(e){console.error(e);}
 finally{busy=false;}
}
async function scoreAnswers(){
 if(roomState.status!=='playing')return;
 const q=roomState.list[roomState.idx]; if(!q)return;
 for(const a of roomState.answers){
  const key=roomState.idx+':'+a.uid; if(a.scored||scored.has(key))continue; scored.add(key);
  const pl=roomState.players.find(p=>p.uid===a.uid); if(!pl)continue;
  const ok=a.choice===q.a, el=Math.max(0,Math.min(20,(a.at-roomState.started_at)/1000)), pts=ok?Math.round(1000*(1-el/40)):0;
  await sb.from('players').update({score:pl.score+pts,correct:pl.correct+(ok?1:0)}).eq('room',roomCode).eq('uid',a.uid);
  await sb.from('answers').update({scored:true}).eq('room',roomCode).eq('idx',roomState.idx).eq('uid',a.uid);
  pl.score+=pts; pl.correct+=ok?1:0; a.scored=true;
 }
}
function ranking(){const p=[...roomState.players].sort((a,b)=>b.score-a.score);return `<div class="wl">${p.map((p,i)=>`<div class="w"><b>${i+1}. ${esc(p.name)}</b><span style="float:right">${p.score} ұпай</span><small>${p.correct} дұрыс жауап</small></div>`).join('')}</div>`;}
function renderHost(){
 clearInterval(hostTimer);
 if(roomState.status==='lobby'){
  app.innerHTML=`<div class="wrap"><h1>Сенің бөлмең</h1><div class="big" style="font-size:54px;letter-spacing:5px">${roomCode}</div><p class="sub">Ойыншыларға осы кодты жібер.</p><h2>Қатысушылар (${roomState.players.length})</h2>${ranking()}<button class="go" id="launch">Викторинаны бастау</button><button class="go alt" id="exit">Басты бет</button></div>`;
  $('#launch').onclick=()=>{if(!(roomState.list||[]).length)return;sb.from('rooms').update({status:'playing',idx:0,started_at:Date.now()}).eq('code',roomCode).then(refresh);};
  $('#exit').onclick=async()=>{await sb.from('rooms').update({status:'closed'}).eq('code',roomCode);cleanupRoom();collabHome();};
  return;
 }
 if(roomState.status==='playing'){
  const q=roomState.list[roomState.idx]; if(!q){finishRoom();return;}
  app.innerHTML=`<div class="wrap"><div class="top"><span>Сұрақ ${roomState.idx+1}/${roomState.list.length}</span><span>Бөлме ${roomCode}</span></div><div class="qt">${esc(q.q)}</div><p class="sub">Жауап берген ойыншылар: ${roomState.answers.length}/${roomState.players.length}</p><h2>Ағымдағы рейтинг</h2>${ranking()}<div id="hostClock" class="sub"></div><button class="go alt" id="next">Келесі сұрақ</button></div>`;
  $('#next').onclick=advanceHost;
  const started=roomState.started_at||Date.now();
  hostTimer=setInterval(()=>{const left=Math.max(0,20-Math.floor((Date.now()-started)/1000));const el=$('#hostClock');if(el)el.textContent='Қалған уақыт: '+left+' сек.';if(left===0)advanceHost();},400);
  return;
 }
 if(roomState.status==='finished'){
  app.innerHTML=`<div class="wrap"><h1>Ойын аяқталды!</h1><h2>Қорытынды рейтинг</h2>${ranking()}<button class="go" id="home">Басты бет</button></div>`;
  $('#home').onclick=()=>{cleanupRoom();collabHome();};
 }
}
async function advanceHost(){
 if(advancing)return; advancing=true; clearInterval(hostTimer);
 try{
  const next=roomState.idx+1;
  if(next>=roomState.list.length) await finishRoom();
  else await sb.from('rooms').update({idx:next,started_at:Date.now()}).eq('code',roomCode);
  await refresh();
 }finally{advancing=false;}
}
async function finishRoom(){clearInterval(hostTimer);await sb.from('rooms').update({status:'finished'}).eq('code',roomCode);}
function renderPlayer(){
 if(roomState.status==='closed'){app.innerHTML=`<div class="wrap"><h1>Иесі бөлмені жапты</h1><button class="go" id="home">Басты бет</button></div>`;$('#home').onclick=()=>{cleanupRoom();collabHome();};return;}
 if(roomState.status==='lobby'){app.innerHTML=`<div class="wrap"><h1>Сәлем, ${esc(myName)}!</h1><div class="big" style="font-size:48px">${roomCode}</div><p class="sub">Иесі викторинаны бастағанша күте тұр.</p><h2>Қатысушылар</h2>${ranking()}</div>`;return;}
 if(roomState.status==='playing'){
  const q=roomState.list[roomState.idx], already=roomState.answers.some(a=>a.uid===playerUid), me=roomState.players.find(p=>p.uid===playerUid)||{};
  app.innerHTML=`<div class="wrap"><div class="top"><span>${roomState.idx+1}/${roomState.list.length}</span><span>${me.score||0} ұпай</span></div><div class="qt">${esc(q.q)}</div><div class="ans">${q.o.map((o,k)=>`<button class="a ${CL[k]}" data-choice="${k}" ${already?'disabled':''}><span>${SH[k]}</span>${esc(o)}</button>`).join('')}</div><div id="playerMsg" class="fb">${already?'Жауабың қабылданды. Нәтижені күт.':'Жауабыңды таңда!'}</div></div>`;
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{
   if(localAnswered)return; localAnswered=true; document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);
   const r=await sb.from('answers').insert({room:roomCode,idx:roomState.idx,choice:+b.dataset.choice,at:Date.now()});
   $('#playerMsg').textContent=(r.error&&r.error.code!=='23505')?'Қате: '+r.error.message:'Жауабың қабылданды!';
  });
  if(!already)localAnswered=false;
  return;
 }
 if(roomState.status==='finished'){const me=roomState.players.find(p=>p.uid===playerUid)||{};app.innerHTML=`<div class="wrap"><h1>Ойын аяқталды!</h1><div class="big">${me.score||0}</div><p class="sub">${me.correct||0} дұрыс жауап</p><h2>Қорытынды рейтинг</h2>${ranking()}<button class="go alt" id="home">Басты бет</button></div>`;$('#home').onclick=()=>{cleanupRoom();collabHome();};}
}
function cleanupRoom(){stopWatch();clearInterval(hostTimer);clearInterval(tm);roomState=null;roomCode=null;myRole='';localAnswered=false;lastSig="";advancing=false;scored.clear();}

collabHome();
</script></body></html>
